openapi: "3.1.0"
info:
  title: "game_backlog_tracker API"
  description: "game_backlog_tracker API"
  version: "1.0.0"
servers:
  - url: /

tags:
  - name: Games
    description: Operations related to games
  - name: Playthroughs
    description: Operations related to playthroughs
  - name: Statistics
    description: Statistics and summaries

paths:
  /games:
    get:
      tags:
        - Games
      description: "Returns all games."
      parameters:
        - name: "orderBy"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "order"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GameResponse"
    post:
      tags:
        - Games
      description: "Creates a game, as long as it's not a duplicate."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCreateRequest"
        required: true
      responses:
        "409":
          description: "Conflict"
          content:
            '*/*':
              schema:
                type: "string"
        "201":
          description: "Created"
          content:
            '*/*':
              schema:
                type: "object"
  /games/{gameId}:
    delete:
      tags:
        - Games
      description: "Deletes the game corresponding to the id. Also deletes all playthroughs referencing the game."
      parameters:
        - name: "gameId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
    get:
      tags:
        - Games
      description: "Returns the game corresponding to the id."
      parameters:
        - name: "gameId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResponse"
    patch:
      tags:
        - Games
      description: "Updates the game's data. "
      parameters:
        - name: "gameId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdateRequest"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
  /playthroughs:
    get:
      tags:
        - Playthroughs
      description: "Returns all playthroughs."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PlaythroughResponse"
    post:
      tags:
        - Playthroughs
      description: "Creates a new playthrough, granted there isn't one already in progress for that game. Only provide gameId or game name, not both."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaythroughCreateRequest"
        required: true
      responses:
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "201":
          description: "Created"
          content:
            '*/*':
              schema:
                type: "object"
  /playthroughs/{playthroughId}:
    delete:
      tags:
        - Playthroughs
      description: "Deletes the playthrough corresponding to the id."
      parameters:
        - name: "playthroughId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
    get:
      tags:
        - Playthroughs
      description: "Returns the playthrough corresponding to the id."
      parameters:
        - name: "playthroughId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlaythroughResponse"
    patch:
      tags:
        - Playthroughs
      description: "Updates the playthrough's status."
      parameters:
        - name: "playthroughId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaythroughUpdateRequest"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
  /statistics:
    get:
      tags:
        - Statistics
      description: "Gets general statistics based on the data: Total and completed playthroughs, total and average playtime, and total games in the tracker for each genre."
      responses:
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GenericStatisticsResponse"
  /statistics/games/top-three-by-playthroughs:
    get:
      tags:
        - Statistics
      description: "Returns the top three games measured by playthrough count."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GameWithPlaythroughCountResponse"
  /statistics/games/with-playthroughs-in-progress:
    get:
      tags:
        - Statistics
      description: "Returns the games with playthroughs in progress."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GameResponse"
  /statistics/games/without-playthroughs:
    get:
      tags:
        - Statistics
      description: "Returns games that have no playthroughs. Games with aborted playthroughs are not returned."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GameResponse"
  /statistics/games/beaten:
    get:
      tags:
        - Statistics
      description: "Returns all games that have a completed playthrough."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GameResponse"
  /statistics/playthroughs/breakdown:
    get:
      tags:
        - Statistics
      description: "Returns a breakdown per genre about how many playthroughs are there corresponding to them, further broken down by status."
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PlaythroughStatusByGenreResponse"
components:
  schemas:
    GameResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        platform:
          type: "string"
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
            - "METROIDVANIA"
            - "SOULSLIKE"
            - "INCREMENTAL"
        gameTime:
          type: "integer"
          format: "int32"
      required:
        - "id"
        - "name"
        - "platform"
        - "genre"
        - "gameTime"
    GameCreateRequest:
      type: "object"
      properties:
        name:
          type: "string"
        platform:
          type: "string"
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
            - "METROIDVANIA"
            - "SOULSLIKE"
            - "INCREMENTAL"
        gameTime:
          type: "integer"
          format: "int32"
      required:
        - "name"
        - "platform"
        - "genre"
        - "gameTime"
    GameUpdateRequest:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        platform:
          type: "string"
          nullable: true
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          nullable: true
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
            - "METROIDVANIA"
            - "SOULSLIKE"
            - "INCREMENTAL"
        gameTime:
          type: "integer"
          format: "int32"
          nullable: true
    PlaythroughResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        gameId:
          type: "integer"
          format: "int32"
        status:
          type: "string"
          enum:
            - "IN_PROGRESS"
            - "DONE"
            - "ABORTED"
      required:
        - "id"
        - "gameId"
        - "status"
    PlaythroughCreateRequest:
      type: "object"
      properties:
        gameId:
          type: "integer"
          format: "int32"
          nullable: true
        gameName:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum:
            - "IN_PROGRESS"
            - "DONE"
            - "ABORTED"
      required:
        - "status"
    PlaythroughUpdateRequest:
      type: "object"
      properties:
        status:
          type: "string"
          nullable: true
          enum:
            - "IN_PROGRESS"
            - "DONE"
            - "ABORTED"
    GenreCountResponse:
      type: "object"
      properties:
        genre:
          type: "string"
        count:
          type: "integer"
          format: "int32"
      required:
        - "genre"
        - "count"
    GenericStatisticsResponse:
      type: "object"
      properties:
        totalPlaythroughs:
          type: "integer"
          format: "int32"
        completedPlaythroughs:
          type: "integer"
          format: "int32"
        totalPlaytime:
          type: "integer"
          format: "int32"
        averagePlaytime:
          type: "number"
          format: "double"
        genreDistribution:
          type: "array"
          items:
            $ref: "#/components/schemas/GenreCountResponse"
      required:
        - "totalPlaythroughs"
        - "completedPlaythroughs"
        - "totalPlaytime"
        - "averagePlaytime"
        - "genreDistribution"
    GameWithPlaythroughCountResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        platform:
          type: "string"
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
            - "METROIDVANIA"
            - "SOULSLIKE"
            - "INCREMENTAL"
        gameTime:
          type: "integer"
          format: "int32"
        playthroughCount:
          type: "integer"
          format: "int32"
      required:
        - "id"
        - "name"
        - "platform"
        - "genre"
        - "gameTime"
        - "playthroughCount"
    PlaythroughStatusByGenreResponse:
      type: "object"
      properties:
        genre:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
            - "METROIDVANIA"
            - "SOULSLIKE"
            - "INCREMENTAL"
        done:
          type: "integer"
          format: "int32"
        inProgress:
          type: "integer"
          format: "int32"
        aborted:
          type: "integer"
          format: "int32"
        total:
          type: "integer"
          format: "int32"
      required:
        - "genre"
        - "done"
        - "inProgress"
        - "aborted"
        - "total"