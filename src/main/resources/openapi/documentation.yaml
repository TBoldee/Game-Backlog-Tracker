openapi: "3.1.0"
info:
  title: "game_backlog_tracker API"
  description: "game_backlog_tracker API"
  version: "1.0.0"
servers:
  - url: /
paths:
  /games:
    get:
      description: ""
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GameResponse"
    post:
      description: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCreateRequest"
        required: true
      responses:
        "409":
          description: "Conflict"
          content:
            '*/*':
              schema:
                type: "string"
        "201":
          description: "Created"
          content:
            '*/*':
              schema:
                type: "object"
  /games/{gameId}:
    delete:
      description: ""
      parameters:
        - name: "gameId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
    get:
      description: ""
      parameters:
        - name: "gameId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResponse"
    patch:
      description: ""
      parameters:
        - name: "gameId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdateRequest"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
  /playthroughs:
    get:
      description: ""
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PlaythroughResponse"
    post:
      description: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaythroughCreateRequest"
        required: true
      responses:
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "201":
          description: "Created"
          content:
            '*/*':
              schema:
                type: "object"
  /playthroughs/{playthroughId}:
    delete:
      description: ""
      parameters:
        - name: "playthroughId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
    get:
      description: ""
      parameters:
        - name: "playthroughId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlaythroughResponse"
    patch:
      description: ""
      parameters:
        - name: "playthroughId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaythroughUpdateRequest"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "204":
          description: "No Content"
          content:
            '*/*':
              schema:
                type: "object"
  /statistics:
    get:
      description: ""
      responses:
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GenericStatisticsResponse"
components:
  schemas:
    GameResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        platform:
          type: "string"
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
        gameTime:
          type: "integer"
          format: "int32"
      required:
        - "id"
        - "name"
        - "platform"
        - "genre"
        - "gameTime"
    GameCreateRequest:
      type: "object"
      properties:
        name:
          type: "string"
        platform:
          type: "string"
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
        gameTime:
          type: "integer"
          format: "int32"
      required:
        - "name"
        - "platform"
        - "genre"
        - "gameTime"
    GameUpdateRequest:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        platform:
          type: "string"
          nullable: true
          enum:
            - "PC"
            - "XBOX"
            - "PLAYSTATION"
            - "NINTENDO_SWITCH"
            - "MOBILE"
        genre:
          type: "string"
          nullable: true
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
        gameTime:
          type: "integer"
          format: "int32"
          nullable: true
    PlaythroughResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        gameId:
          type: "integer"
          format: "int32"
        status:
          type: "string"
          enum:
            - "IN_PROGRESS"
            - "DONE"
            - "ABORTED"
      required:
        - "id"
        - "gameId"
        - "status"
    PlaythroughCreateRequest:
      type: "object"
      properties:
        gameId:
          type: "integer"
          format: "int32"
          nullable: true
        gameName:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum:
            - "IN_PROGRESS"
            - "DONE"
            - "ABORTED"
      required:
        - "status"
    PlaythroughUpdateRequest:
      type: "object"
      properties:
        status:
          type: "string"
          nullable: true
          enum:
            - "IN_PROGRESS"
            - "DONE"
            - "ABORTED"
    GenericStatisticsResponse:
      type: "object"
      properties:
        totalPlaythroughs:
          type: "integer"
          format: "int32"
        completedPlaythroughs:
          type: "integer"
          format: "int32"
        totalPlaytime:
          type: "integer"
          format: "int32"
        averagePlaytime:
          type: "number"
          format: "double"
        genreDistribution:
          type: "string"
          enum:
            - "ACTION"
            - "ADVENTURE"
            - "RPG"
            - "JRPG"
            - "MMORPG"
            - "FPS"
            - "TPS"
            - "RTS"
            - "STRATEGY"
            - "SIMULATION"
            - "PUZZLE"
            - "PLATFORMER"
            - "HORROR"
            - "RACING"
            - "SPORTS"
      required:
        - "totalPlaythroughs"
        - "completedPlaythroughs"
        - "totalPlaytime"
        - "averagePlaytime"
        - "genreDistribution"